<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramadan Mubarak — Card Generator | المشتري الرئيس</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050b23;
      --cyan:#5aa3c7;
      --white:#F2EDE4;
      --dim: rgba(242,237,228,.6);
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
      background: radial-gradient(1200px 800px at 50% 0%, #0b1b3b 0%, var(--bg) 60%);
      color:var(--white);
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:48px 16px;
    }

    .container{
      width:100%;
      max-width:860px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
    }

    .header{ text-align:center; }
    .header-tag{
      font-size:11px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--cyan);
      font-weight:600;
      margin-bottom:12px;
    }
    .header h1{
      font-size:clamp(26px,4.6vw,42px);
      font-weight:300;
      line-height:1.25;
    }
    .header h1 em{font-style:italic;color:var(--cyan);}
    .subtitle{
      margin-top:10px;
      color:var(--dim);
      font-weight:300;
      font-size:14px;
    }

    .input-area{
      display:flex;
      align-items:center;
      width:100%;
      max-width:520px;
      direction:ltr;
      gap:0;
    }
    .input-area input{
      flex:1;
      padding:16px 18px;
      font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
      font-size:15px;
      font-weight:300;
      border:1px solid rgba(90,163,199,.25);
      border-right:none;
      border-radius:10px 0 0 10px;
      background:rgba(255,255,255,.04);
      color:var(--white);
      outline:none;
      transition:.2s ease;
    }
    .input-area input::placeholder{color:rgba(242,237,228,.55);}
    .input-area input:focus{
      border-color:rgba(90,163,199,.55);
      background:rgba(255,255,255,.06);
    }

    .input-area button{
      padding:16px 22px;
      font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      border:1px solid rgba(90,163,199,.35);
      border-radius:0 10px 10px 0;
      background:rgba(90,163,199,.10);
      color:#bfe8ff;
      cursor:pointer;
      transition:.2s ease;
      white-space:nowrap;
    }
    .input-area button:hover{background:rgba(90,163,199,.18);border-color:rgba(90,163,199,.55);}
    .input-area button:disabled{opacity:.25;cursor:not-allowed;}

    .preview{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .card-frame{
      width:100%;
      max-width:760px;
      aspect-ratio: 3 / 4; /* تصميمك طولي */
      border-radius:12px;
      overflow:hidden;
      position:relative;
      box-shadow:0 30px 80px rgba(0,0,0,.45);
      background:rgba(0,0,0,.2);
    }
    .card-frame::after{
      content:'';
      position:absolute; inset:0;
      border:1px solid rgba(90,163,199,.14);
      border-radius:12px;
      pointer-events:none;
    }
    canvas{width:100%;height:100%;display:block;}

    .download-btn{
      padding:12px 28px;
      font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
      font-size:12px;
      font-weight:600;
      letter-spacing:1px;
      border:1px solid rgba(90,163,199,.25);
      border-radius:999px;
      background:transparent;
      color:var(--cyan);
      cursor:pointer;
      transition:.2s ease;
      display:none;
      align-items:center;
      gap:10px;
    }
    .download-btn:hover{background:var(--cyan);color:var(--bg);border-color:var(--cyan);}
    .download-btn.visible{display:inline-flex;}
    .download-btn svg{width:14px;height:14px;}

    .footer-note{
      font-size:11px;
      color:rgba(242,237,228,.55);
      font-weight:300;
      text-align:center;
    }

    @media (max-width:520px){
      .input-area{flex-direction:column;gap:10px;}
      .input-area input{border-radius:10px;border-right:1px solid rgba(90,163,199,.25);}
      .input-area button{border-radius:10px;width:100%;}
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-tag">Ramadan 2026 — المشتري الرئيس</div>
      <h1>Create your <em>Ramadan</em> card</h1>
      <p class="subtitle">Enter your name to generate a personalized greeting</p>
		<p class="subtitle">أدخل اسمك لإنشاء التحية الخاصة بك</p>
    </div>

    <div class="input-area">
      <input type="text" id="nameInput" placeholder="Your name / اسمك" maxlength="36" autofocus />
      <button id="generateBtn" disabled>Generate إنشاء</button>
    </div>

    <div class="preview">
      <div class="card-frame">
        <canvas id="canvas" width="1080" height="1440"></canvas>
      </div>

      <button class="download-btn" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v13m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        </svg>
        Download JPG
      </button>
    </div>

    <div class="footer-note">رمضان مبارك — Ramadan Mubarak</div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;   // 1080
const H = canvas.height;  // 1440

const nameInput = document.getElementById('nameInput');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');

let currentName = '';
const FONT = '"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif';

// ✅ رابط صورتك
const CARD_IMAGE_SRC = "https://iili.io/qdpXmua.png";

const bgImg = new Image();
bgImg.crossOrigin = "anonymous"; // مهم للتحميل (قد يعتمد على CORS في السيرفر)
bgImg.src = CARD_IMAGE_SRC;

function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function drawImageCover(img){
  // cover بدون تشويه
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const ir = iw / ih;
  const cr = W / H;

  let sx, sy, sw, sh;
  if (ir > cr) {
    sh = ih; sw = ih * cr;
    sx = (iw - sw) / 2; sy = 0;
  } else {
    sw = iw; sh = iw / cr;
    sx = 0; sy = (ih - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
}

function fitText(text, maxWidth){
  // يقص النص لو طويل
  let t = text || "";
  while (t.length > 1 && ctx.measureText(t).width > maxWidth) {
    t = t.slice(0, -1);
  }
  if (t !== text) t = t.slice(0, Math.max(1, t.length-1)) + "…";
  return t;
}

function drawOverlayText(name){
  // تظليل خفيف فقط لضمان قراءة النص (خفيف جدًا)


  // ✅ الاسم داخل المستطيل (مكان الاسم في التصميم)
  const boxW = W * 0.74;
  const boxH = 112;
  const boxX = (W - boxW) / 2;
  const boxY = H * 0.705;



  // نص الاسم
  const safeName = (name || "").trim();
  ctx.save();
  ctx.globalAlpha = safeName ? 0.95 : 0.55;
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `600 52px ${FONT}`;

  const hasArabic = /[\u0600-\u06FF]/.test(safeName);
  ctx.direction = hasArabic ? "rtl" : "ltr";

  const displayName = safeName ? fitText(safeName, boxW - 60) : "اكتب اسمك / Your name";
  ctx.fillText(displayName, W/2, boxY + boxH/2);
  ctx.restore();
}

function drawCard(name){
  ctx.clearRect(0,0,W,H);

  if (bgImg.complete && bgImg.naturalWidth > 0) {
    drawImageCover(bgImg);
  } else {
    // fallback مؤقت لو الصورة ما حملت
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#0b1b3b");
    g.addColorStop(1, "#050b23");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 0.6;
    ctx.font = `500 24px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Loading background...", W/2, H/2);
    ctx.globalAlpha = 1;
  }

  drawOverlayText(name);
}

// ─── INIT ───
function init() { drawCard(''); }

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (bgImg.complete) init();
  });
} else {
  setTimeout(init, 800);
}

bgImg.onload = () => init();
bgImg.onerror = () => init();

// ─── EVENTS ───
nameInput.addEventListener('input', () => {
  generateBtn.disabled = !nameInput.value.trim();
});

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && nameInput.value.trim()) generateBtn.click();
});

generateBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) return;
  currentName = name;
  drawCard(name);
  downloadBtn.classList.add('visible');
  document.querySelector('.card-frame').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

downloadBtn.addEventListener('click', () => {
  try {
    const link = document.createElement('a');
    link.download = `Ramadan-Mubarak-${currentName.replace(/\s+/g, '-')}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  } catch (err) {
    alert(
      "تعذر تنزيل الصورة غالباً بسبب CORS من رابط الخلفية.\n" +
      "الحل: نزّل الخلفية وضعها بجانب ملف HTML واستخدم اسم الملف بدل الرابط."
    );
  }
});
</script>

</body>
</html>
